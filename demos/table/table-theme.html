<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Themed Table</title>

<!-- The theme stylesheet is swapped at runtime based on the ?theme= param -->
<link id="theme" href="../../themes/light.css" rel="stylesheet" type="text/css" />

<script src="../../src/table/Table.js"></script>
<script src="../../src/utils/Utils.js"></script>
<script src="../../themes/default.js"></script>
<script src="names.js"></script>

<style>
    html, body { height: 100%; margin: 0; }
    #table {
        height: 100%;
    }
</style>

<script>
window.onload = function() {

  //Swap in the requested theme stylesheet (light | dark)
    var theme = (javaxt.dhtml.utils.getParameter("theme") || "light").toLowerCase();
    if (theme==="dark"){
        document.getElementById("theme").href = "../../themes/dark.css";
    }
    document.body.style.backgroundColor = theme==="dark" ? "#2b2e35" : "#ffffff";


  //Convert the [name, count] records defined in names.js into table rows
    var rows = [];
    for (var i=0; i<popularNames.length; i++){
        var name = popularNames[i][0];
        var count = popularNames[i][1];
        rows.push([name, i+1, count.toLocaleString()]);
    }


  //Style the table using the active theme's "table" map (CSS class names)
    var table = new javaxt.dhtml.Table(document.getElementById("table"), {
        columns: [
            {header: 'Name', width:'100%'},
            {header: 'Rank', width:'60', align:'center'},
            {header: 'Count', width:'100', align:'right'}
        ],
        style: javaxt.dhtml.style.default.table
    });
    table.addRows(rows);
};
</script>
</head>
<body>
<div id="table"></div>
</body>
</html>
